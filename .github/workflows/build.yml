name: OrangeFox / TWRP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v3

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
        libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip bc ccache zip curldroid python3 repo

    - name: Initialize Repo & Sync
      run: |
        mkdir ~/fox && cd ~/fox
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        repo init -u https://github.com/minimal-manifest-twrp/firmware_manifest_twrp.git -b twrp-11 --depth=1
        repo sync -c --no-clone-bundle --no-tags -j$(nproc)

    - name: Link Device Tree
      run: |
        mkdir -p ~/fox/device/samsung/a32
        cp -r $GITHUB_WORKSPACE/* ~/fox/device/samsung/a32/

    - name: Build Recovery
      run: |
        cd ~/fox
        source build/envsetup.sh
        lunch twrp_a32-eng || lunch omni_a32-eng
        mka recoveryimage -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: OrangeFox_A32_Recovery
        path: |
          /home/runner/fox/out/target/product/a32/recovery.img
          /home/runner/fox/out/target/product/a32/OrangeFox*.zip
