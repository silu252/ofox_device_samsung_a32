name: OrangeFox / TWRP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4.1.7

    - name: Set up Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
        gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
        libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
        python3 python3-pip python-is-python3
        
        # Python 2 sentaks hatasını çözmek için gerçek python2 paketini kur
        sudo apt-get install -y python2-minimal || true
        if [ -f /usr/bin/python2.7 ]; then
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
        fi

        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH

    - name: Initialize Repo & Sync
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git config --global core.compression 0
        mkdir -p ~/fox && cd ~/fox
        repo init --no-repo-verify -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b android-11.0 --depth=1
        repo sync -c --no-clone-bundle --no-tags --force-sync -j$(nproc)

    - name: Link Device Tree & Fix Configs
      run: |
        mkdir -p ~/fox/device/samsung/a32
        cp -r $GITHUB_WORKSPACE/* ~/fox/device/samsung/a32/

        # roomservice.py içindeki Python 2 sentaks hatasını yamala
        sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/g' ~/fox/vendor/pb/build/tools/roomservice.py || true

        # Device tree dosyalarındaki twrp/omni yollarını pb ile değiştir ve eksik vendor bağımlılığını sağla
        find ~/fox/device/samsung/a32/ -type f -exec sed -i 's|vendor/twrp|vendor/pb|g' {} +
        find ~/fox/device/samsung/a32/ -type f -exec sed -i 's|vendor/omni|vendor/pb|g' {} +

        # pb_a32.mk ve pb.dependencies için eşleme oluştur
        cd ~/fox/device/samsung/a32
        if [ -f twrp_a32.mk ]; then cp twrp_a32.mk pb_a32.mk; fi
        if [ -f omni_a32.mk ]; then cp omni_a32.mk pb_a32.mk; fi
        sed -i 's|twrp_a32|pb_a32|g' pb_a32.mk || true
        sed -i 's|omni_a32|pb_a32|g' pb_a32.mk || true

    - name: Build Recovery
      run: |
        cd ~/fox
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        source build/envsetup.sh
        lunch pb_a32-eng || lunch twrp_a32-eng || lunch omni_a32-eng
        mka recoveryimage -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Recovery_A32
        path: |
          /home/runner/fox/out/target/product/a32/recovery.img
          /home/runner/fox/out/target/product/a32/*.zip
          /home/runner/fox/out/target/product/a32/*.tar
